<!DOCTYPE html>
<html lang="uz">
<head>
  <!-- Replaced by the value of `flutter build web --base-href`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="description" content="Qazo namoz va ro‘zalar hisobi — internetsiz ishlaydi.">
  <meta name="theme-color" content="#F8F7F2">

  <!-- Installable as a home-screen app on iPad / iPhone (Safari → Share →
       Add to Home Screen). -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="QazoHisob">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>QazoHisob</title>
  <style>
    html, body { margin: 0; height: 100%; background: #F8F7F2; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #0B1714; }
    }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: -apple-system, system-ui, sans-serif; color: #89928C;
      transition: opacity .3s ease;
    }
    #splash img { width: 96px; height: 96px; border-radius: 22px;
      box-shadow: 0 10px 30px rgba(16, 61, 50, .25); }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <div>QazoHisob</div>
  </div>
  <script>
    // If the app fails to start, show the reason on the splash screen so the
    // user can send a screenshot instead of staring at a blank page.
    (function () {
      function show(text) {
        var splash = document.getElementById('splash');
        if (!splash) return;
        var box = document.getElementById('splash-msg');
        if (!box) {
          box = document.createElement('div');
          box.id = 'splash-msg';
          box.style.cssText = 'max-width:520px;padding:0 24px;text-align:center;' +
            'font-size:14px;line-height:1.5;color:#5B6660;white-space:pre-wrap';
          splash.appendChild(box);
          var again = document.createElement('a');
          again.href = '#';
          again.textContent = 'Qayta yuklash';
          again.style.cssText = 'color:#075B46;font-weight:600;font-size:16px';
          again.onclick = function (e) { e.preventDefault(); location.reload(); };
          splash.appendChild(again);
        }
        box.textContent = text + '\n\n' + navigator.userAgent;
      }
      window.addEventListener('error', function (e) {
        show('Xato: ' + (e.message || e.error || 'noma’lum'));
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        show('Xato: ' + ((r && r.message) || r || 'noma’lum'));
      });
      setTimeout(function () {
        if (document.getElementById('splash') && !document.getElementById('splash-msg')) {
          show('Ilova yuklanishi odatdagidan uzoq davom etyapti.');
        }
      }, 30000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
